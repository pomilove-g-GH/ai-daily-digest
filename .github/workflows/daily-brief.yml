name: Daily AI Brief

on:
  schedule:
    - cron: '0 23 * * *'  # 매일 08:00 KST (= 23:00 UTC)
  workflow_dispatch:       # 수동 실행 (테스트·재실행용)

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git
        run: |
          git config user.name "AI Daily Digest Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate daily briefing
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          PROMPT=$(cat GENERATE.md)
          claude -p "$PROMPT" \
            --allowedTools "WebSearch,WebFetch,Bash,Read,Write,Edit,Glob,Grep"
